services:
  lamb:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-lamb.rule=Host(`${FQDN_LAMB:-lamb.test}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-lamb.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-lamb.tls=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-lamb.loadbalancer.server.port=9099"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-lamb.loadbalancer.server.scheme=http"

  openwebui:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-owi.rule=Host(`${FQDN_LAMB:-owi.test}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-owi.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-owi.tls=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-owi.loadbalancer.server.port=8080"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-owi.loadbalancer.server.scheme=http"
